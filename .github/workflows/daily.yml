name: Daily digest

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 12:00 UTC = 14:00 Israel (winter), Mon–Fri
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: write             # lets the run save history.json (agent memory)
  pull-requests: write        # lets the run open portfolio proposal PRs

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # One proposal at a time: skip the review while a proposal PR is still open.
      - name: Check for open proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list --label portfolio-proposal --state open --json number --jq length 2>/dev/null || echo 0)
          echo "OPEN_PROPOSAL=$n" >> "$GITHUB_ENV"

      - name: Run agent
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python agent.py

      - name: Save agent memory
        run: |
          git config user.name "stock-pipeline-bot"
          git config user.email "actions@github.com"
          git add history.json
          if [ -f proposals.json ]; then git add proposals.json; fi
          git diff --staged --quiet || git commit -m "memory: $(date -u +%F)"
          git push

      # The agent only proposes; merging this PR is the human approval.
      - name: Open proposal pull request
        if: hashFiles('proposal/portfolio.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="proposal/$(date -u +%F)"
          git checkout -b "$branch"
          cp proposal/portfolio.json portfolio.json
          git add portfolio.json
          git commit -m "$(cat proposal/title.txt)"
          git push --force -u origin "$branch"
          gh label create portfolio-proposal --color 2563eb \
            --description "Holding changes proposed by the agent" 2>/dev/null || true
          gh pr create --base main --head "$branch" --label portfolio-proposal \
            --title "$(cat proposal/title.txt)" --body-file proposal/body.md
