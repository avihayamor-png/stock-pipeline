name: Daily digest

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 12:00 UTC = 14:00 Israel (winter), Mon–Fri
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: write             # lets the run save history.json (agent memory)

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run agent
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python agent.py

      - name: Save agent memory
        run: |
          git config user.name "stock-pipeline-bot"
          git config user.email "actions@github.com"
          git add history.json
          git diff --staged --quiet || git commit -m "memory: $(date -u +%F)"
          git push
